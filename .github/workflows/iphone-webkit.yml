name: iPhone WebKit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Supabase security foundation
        run: pnpm test:schema
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: Run iPhone WebKit tests
        run: pnpm test:iphone
      - name: Upload failure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: iphone-webkit-playwright-report
          path: playwright-report/
          retention-days: 14
